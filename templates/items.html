<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Catálogo de Ítems - MuDream Multiverso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0814; color: #e6e1ff; font-family: 'Segoe UI', system-ui, sans-serif; }
        .grid-items-mu { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.25rem; }
        .mu-item-card {
            background: #0f0c1b;
            border: 1px solid #2b214a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }
        .mu-item-card:hover { transform: translateY(-3px); border-color: #8b5cf6; }
        .badge-pj {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.5);
            color: #c4b5fd;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-6xl mb-6 border-b border-purple-900/50 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-emerald-400 drop-shadow">🛡️ CATÁLOGO DE ÍTEMS MU</h1>
            <p class="text-xs text-purple-300">Explorador de ítems por Clase (PJ) y Opciones (DD, Reflect, HP, SD)</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleModalNuevoItem()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow">
                ➕ Agregar Ítem
            </button>
            <a href="/" class="bg-purple-900 hover:bg-purple-800 text-purple-200 border border-purple-600 px-4 py-2 rounded-lg text-xs font-bold transition">
                ← Volver al Monitor
            </a>
        </div>
    </header>

    <div class="w-full max-w-6xl space-y-6">
        
        <!-- Panel de Filtros -->
        <div class="bg-[#141126] border border-purple-900/60 p-5 rounded-xl space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs uppercase text-purple-300 font-bold mb-1.5">Clase / Personaje (PJ):</label>
                    <select id="filtroRaza" onchange="aplicarFiltros()" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-sm outline-none">
                        <option value="">Todos los Personajes</option>
                        <option value="Dark Knight">BK - Dark Knight</option>
                        <option value="Dark Wizard">SM - Dark Wizard</option>
                        <option value="Elf">ME - Fairy Elf</option>
                        <option value="Magic Gladiator">MG - Magic Gladiator</option>
                        <option value="Dark Lord">DL - Dark Lord</option>
                        <option value="Summoner">SUM - Summoner</option>
                        <option value="Rage Fighter">RF - Rage Fighter</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs uppercase text-purple-300 font-bold mb-1.5">Opción Principal (No toma Exclusive Bonus):</label>
                    <select id="filtroOpcion" onchange="aplicarFiltros()" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-sm outline-none">
                        <option value="">Todas las Opciones</option>
                        <option value="damage decrease">DD (Damage Decrease)</option>
                        <option value="reflect">REFLECT (Reflect Damage)</option>
                        <option value="maximum life">HP (Increases Life)</option>
                        <option value="maximum sd">SD (Increases SD)</option>
                        <option value="critical damage">CRITICAL (Critical Damage)</option>
                        <option value="excellent damage">EXC DMG (Excellent Damage)</option>
                        <option value="zen drop">ZEN (Zen Drop Rate)</option>
                        <option value="attack speed">Speed (Attack Speed)</option>
                        <option value="damage to monsters">Damage to Monsters</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs uppercase text-purple-300 font-bold mb-1.5">Buscar por Nombre:</label>
                    <input type="text" id="filtroTexto" oninput="aplicarFiltros()" placeholder="Ej. Sphinx, Bronze, Samut, Bow..." class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-sm outline-none">
                </div>
            </div>

            <!-- Accesos Rápidos de Opciones MU -->
            <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-purple-900/40">
                <span class="text-xs text-gray-400 font-semibold mr-1">Filtros rápidos:</span>
                <button onclick="setFiltroRapido('damage decrease')" class="px-2.5 py-1 rounded bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-700/60 text-xs font-bold transition">🛡️ DD</button>
                <button onclick="setFiltroRapido('reflect')" class="px-2.5 py-1 rounded bg-yellow-950/80 hover:bg-yellow-900 text-yellow-300 border border-yellow-700/60 text-xs font-bold transition">⚡ Reflect</button>
                <button onclick="setFiltroRapido('maximum life')" class="px-2.5 py-1 rounded bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-700/60 text-xs font-bold transition">❤️ HP</button>
                <button onclick="setFiltroRapido('maximum sd')" class="px-2.5 py-1 rounded bg-cyan-950/80 hover:bg-cyan-900 text-cyan-300 border border-cyan-700/60 text-xs font-bold transition">🔷 SD</button>
                <button onclick="setFiltroRapido('critical damage')" class="px-2.5 py-1 rounded bg-purple-950/80 hover:bg-purple-900 text-purple-300 border border-purple-700/60 text-xs font-bold transition">💥 Crítico</button>
                <button onclick="setFiltroRapido('')" class="px-2.5 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-bold transition">Limpiar</button>
            </div>
        </div>

        <div class="flex justify-between items-center text-xs text-gray-400 px-1">
            <span id="contador-items">Cargando ítems...</span>
        </div>

        <div id="contenedor-items" class="grid-items-mu">
            <div class="text-gray-500 text-center col-span-full py-8">Cargando inventario...</div>
        </div>
    </div>

    <!-- MODAL PARA AGREGAR NUEVO ÍTEM -->
    <div id="modal-nuevo-item" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4 overflow-y-auto">
        <div class="bg-[#141126] border border-emerald-500 p-6 rounded-xl w-full max-w-md shadow-2xl text-left my-8">
            <h3 class="text-lg font-bold text-emerald-400 mb-3 text-center">➕ Agregar Nuevo Ítem</h3>
            
            <label class="block text-xs text-purple-300 font-semibold mb-1">Enlace o ID de la imagen en Google Drive:</label>
            <input type="text" id="nuevoItemDrive" placeholder="https://drive.google.com/file/d/..." class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Nombre del Ítem:</label>
            <input type="text" id="nuevoItemNombre" placeholder="Ej. Excellent Sphinx Armor" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Clases que lo equipan (separadas por coma):</label>
            <input type="text" id="nuevoItemClases" placeholder="Dark Wizard, Magic Gladiator" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Opciones Principales (separadas por punto y coma ;):</label>
            <input type="text" id="nuevoItemOpciones" placeholder="[Legendary] Increases maximum life +4%; [Rare] Increases zen drop rate +21%" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Exclusive Excellent Bonus (separadas por punto y coma ;):</label>
            <input type="text" id="nuevoItemBonus" placeholder="Increases Energy +50; Increases Vitality +41" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-4 text-sm outline-none">

            <div class="flex gap-2">
                <button onclick="guardarNuevoItemDesdeWeb()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded text-sm transition">💾 Guardar Ítem</button>
                <button onclick="toggleModalNuevoItem()" class="w-full bg-gray-800 text-gray-400 font-bold py-2 rounded text-sm">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL PARA EDITAR ÍTEM EXISTENTE -->
    <div id="modal-editar-item" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50 p-4 overflow-y-auto">
        <div class="bg-[#141126] border border-purple-500 p-6 rounded-xl w-full max-w-md shadow-2xl text-left my-8">
            <h3 class="text-lg font-bold text-purple-300 mb-3 text-center">✏️ Editar Ítem</h3>
            <input type="hidden" id="editItemId">
            
            <label class="block text-xs text-purple-300 font-semibold mb-1">Nombre del Ítem:</label>
            <input type="text" id="editItemNombre" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Clases (separadas por coma):</label>
            <input type="text" id="editItemClases" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Opciones (separadas por punto y coma ;):</label>
            <input type="text" id="editItemOpciones" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none">

            <label class="block text-xs text-purple-300 font-semibold mb-1">Bonus Excelente (separadas por punto y coma ;):</label>
            <input type="text" id="editItemBonus" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-4 text-sm outline-none">

            <div class="flex gap-2">
                <button onclick="guardarEdicionItem()" class="w-full bg-purple-700 hover:bg-purple-600 text-white font-bold py-2 rounded text-sm transition">💾 Actualizar</button>
                <button onclick="toggleModalEditarItem()" class="w-full bg-gray-800 text-gray-400 font-bold py-2 rounded text-sm">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let catalogo = [];

        function setFiltroRapido(opcion) {
            document.getElementById('filtroOpcion').value = opcion;
            aplicarFiltros();
        }

        function toggleModalNuevoItem() {
            document.getElementById('modal-nuevo-item').classList.toggle('hidden');
        }

        function toggleModalEditarItem() {
            document.getElementById('modal-editar-item').classList.toggle('hidden');
        }

        function abrirEditor(id) {
            const it = catalogo.find(x => x.id === id);
            if (!it) return;
            document.getElementById('editItemId').value = it.id;
            document.getElementById('editItemNombre').value = it.nombre || '';
            document.getElementById('editItemClases').value = (it.clases || []).join(', ');
            document.getElementById('editItemOpciones').value = (it.opciones || []).join('; ');
            document.getElementById('editItemBonus').value = (it.bonus_excelente || []).join('; ');
            toggleModalEditarItem();
        }

        async function cargar() {
            try {
                const res = await fetch('/api/items');
                if (res.ok) {
                    catalogo = await res.json();
                    renderizar(catalogo);
                } else {
                    document.getElementById('contenedor-items').innerHTML = '<div class="text-red-400 text-center col-span-full">Error al consultar el servidor.</div>';
                }
            } catch (e) {
                document.getElementById('contenedor-items').innerHTML = '<div class="text-red-400 text-center col-span-full">Error de red al cargar datos.</div>';
            }
        }

        function renderizar(items) {
            const c = document.getElementById('contenedor-items');
            document.getElementById('contador-items').innerText = `Mostrando ${items.length} ítem(s) de un total de ${catalogo.length}`;

            if (!items || items.length === 0) {
                c.innerHTML = '<div class="text-gray-500 text-center col-span-full py-12">No hay ítems con estos filtros.</div>';
                return;
            }

            c.innerHTML = items.map(item => {
                const img = `https://lh3.googleusercontent.com/d/${item.drive_id}`;
                
                const clasesHTML = (item.clases && item.clases.length > 0)
                    ? item.clases.map(pj => `<span class="badge-pj">${pj}</span>`).join(' ')
                    : '<span class="text-gray-500 text-xs">Sin clase definida</span>';

                return `
                    <div class="mu-item-card p-4 flex flex-col justify-between relative">
                        <button onclick="abrirEditor(${item.id})" title="Editar nombre o opciones" class="absolute top-3 right-3 bg-black/60 hover:bg-black/90 text-purple-300 hover:text-white px-2 py-1 rounded text-[11px] font-bold border border-purple-500/40 z-10">
                            ✏️ Editar
                        </button>
                        <div>
                            <!-- Imagen Drive -->
                            <div class="w-full h-56 bg-black rounded-lg flex items-center justify-center overflow-hidden mb-3 border border-purple-950">
                                <img src="${img}" alt="${item.nombre}" loading="lazy" class="max-h-full max-w-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200/0f0c1b/4ade80?text=Item+MU';">
                            </div>

                            <!-- Nombre -->
                            <h3 class="text-center font-bold text-emerald-400 text-base mb-2">${item.nombre}</h3>
                            
                            <!-- Estadísticas -->
                            <div class="text-xs space-y-1 text-center mb-3">
                                ${item.base_score ? `<p class="text-amber-400 font-semibold">Base Score: ${item.base_score}</p>` : ''}
                                ${item.grade_score ? `<p class="text-purple-400 font-semibold">Grade Score: ${item.grade_score}</p>` : ''}
                                ${item.defense ? `<p class="text-blue-300 font-semibold">Defense: ${item.defense}</p>` : ''}
                                ${item.durability && item.durability !== '-' ? `<p class="text-gray-300">Durability: [${item.durability}]</p>` : ''}
                                ${item.requisitos?.strength ? `<p class="text-red-400 font-medium">Strength: ${item.requisitos.strength}</p>` : ''}
                                ${item.requisitos?.agility ? `<p class="text-gray-300">Agility: ${item.requisitos.agility}</p>` : ''}
                                ${item.requisitos?.energy ? `<p class="text-cyan-300">Energy: ${item.requisitos.energy}</p>` : ''}
                            </div>

                            <!-- Clases (PJ) -->
                            <div class="mb-3">
                                <span class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Equipable por:</span>
                                <div class="flex flex-wrap gap-1">
                                    ${clasesHTML}
                                </div>
                            </div>
                        </div>

                        <!-- Opciones (Filtro activo exclusivamente en este bloque) -->
                        <div class="border-t border-purple-900/50 pt-2 text-xs space-y-1">
                            <span class="text-[10px] text-purple-300 uppercase font-bold block mb-1">Opciones:</span>
                            ${(item.opciones || []).map(opt => {
                                const optL = opt.toLowerCase();
                                const esLegendary = opt.includes('Legendary');
                                const esDD = optL.includes('decrease') || optL.includes('dd');
                                const esReflect = optL.includes('reflect');
                                const esLife = optL.includes('life') || optL.includes('hp');

                                let colorClass = 'text-purple-300';
                                if (esLegendary) colorClass = 'text-amber-400 font-semibold';
                                else if (esDD) colorClass = 'text-red-400 font-semibold';
                                else if (esReflect) colorClass = 'text-yellow-300 font-semibold';
                                else if (esLife) colorClass = 'text-emerald-400 font-semibold';

                                return `<p class="${colorClass}">• ${opt}</p>`;
                            }).join('')}

                            <!-- Exclusive Excellent Bonus: SE MUESTRA VISUALMENTE PERO EL FILTRO LO IGNORA -->
                            ${(item.bonus_excelente && item.bonus_excelente.length > 0) ? `
                                <div class="mt-2 pt-1 border-t border-purple-950">
                                    <span class="text-[10px] text-cyan-400 font-bold block mb-0.5">Exclusive Excellent Bonus:</span>
                                    ${item.bonus_excelente.map(b => `<p class="text-cyan-300 text-[11px] font-mono">• ${b}</p>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function aplicarFiltros() {
            const raza = document.getElementById('filtroRaza').value.toLowerCase();
            const opcion = document.getElementById('filtroOpcion').value.toLowerCase();
            const busqueda = document.getElementById('filtroTexto').value.toLowerCase();

            const filtrados = catalogo.filter(item => {
                // 1. Coincidencia por Clase / PJ
                const matchRaza = !raza || (item.clases && item.clases.some(c => c.toLowerCase().includes(raza)));

                // 2. Coincidencia por Opciones: SOLO en item.opciones (EXCLUYE EXCLUSIVE EXCELLENT BONUS)
                const textoOpciones = (item.opciones || []).join(' ').toLowerCase();

                let matchOpcion = true;
                if (opcion) {
                    if (opcion === 'damage decrease') {
                        matchOpcion = textoOpciones.includes('damage decrease') || textoOpciones.includes('dd');
                    } else if (opcion === 'reflect') {
                        matchOpcion = textoOpciones.includes('reflect');
                    } else if (opcion === 'maximum life') {
                        matchOpcion = textoOpciones.includes('maximum life') || textoOpciones.includes('life') || textoOpciones.includes('hp');
                    } else if (opcion === 'maximum sd') {
                        matchOpcion = textoOpciones.includes('sd');
                    } else {
                        matchOpcion = textoOpciones.includes(opcion);
                    }
                }

                // 3. Coincidencia por Nombre
                const matchTexto = !busqueda || (item.nombre && item.nombre.toLowerCase().includes(busqueda));

                return matchRaza && matchOpcion && matchTexto;
            });

            renderizar(filtrados);
        }

        async function guardarNuevoItemDesdeWeb() {
            const drive_id = document.getElementById('nuevoItemDrive').value.trim();
            const nombre = document.getElementById('nuevoItemNombre').value.trim();
            const clasesRaw = document.getElementById('nuevoItemClases').value.trim();
            const opcionesRaw = document.getElementById('nuevoItemOpciones').value.trim();
            const bonusRaw = document.getElementById('nuevoItemBonus').value.trim();

            if (!drive_id || !nombre) {
                alert("Ingresá al menos el enlace de Drive y el nombre del ítem.");
                return;
            }

            const payload = {
                drive_id: drive_id,
                nombre: nombre,
                clases: clasesRaw ? clasesRaw.split(',').map(s => s.trim()) : [],
                opciones: opcionesRaw ? opcionesRaw.split(';').map(s => s.trim()) : [],
                bonus_excelente: bonusRaw ? bonusRaw.split(';').map(s => s.trim()) : []
            };

            try {
                const res = await fetch('/api/items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    toggleModalNuevoItem();
                    cargar();
                } else {
                    alert("Error al guardar ítem.");
                }
            } catch (e) {
                alert("Error de red.");
            }
        }

        async function guardarEdicionItem() {
            const id = parseInt(document.getElementById('editItemId').value);
            const nombre = document.getElementById('editItemNombre').value.trim();
            const clasesRaw = document.getElementById('editItemClases').value.trim();
            const opcionesRaw = document.getElementById('editItemOpciones').value.trim();
            const bonusRaw = document.getElementById('editItemBonus').value.trim();

            const payload = {
                id: id,
                nombre: nombre,
                clases: clasesRaw ? clasesRaw.split(',').map(s => s.trim()) : [],
                opciones: opcionesRaw ? opcionesRaw.split(';').map(s => s.trim()) : [],
                bonus_excelente: bonusRaw ? bonusRaw.split(';').map(s => s.trim()) : []
            };

            try {
                const res = await fetch('/api/items', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    toggleModalEditarItem();
                    cargar();
                } else {
                    alert("No se pudo actualizar el ítem.");
                }
            } catch (e) {
                alert("Error de conexión.");
            }
        }

        document.addEventListener('DOMContentLoaded', cargar);
    </script>
</body>
</html>
