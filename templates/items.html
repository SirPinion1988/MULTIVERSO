<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Catálogo de Armaduras & Baúles - Multiverso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0814; color: #e6e1ff; font-family: 'Segoe UI', system-ui, sans-serif; }
        .tabla-scroll-box {
            height: 520px !important;
            overflow-y: scroll !important;
            border: 1px solid #3b2d6b;
            border-radius: 8px;
            background: #0d0a1a;
            position: relative;
        }
        .tabla-items { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        .tabla-items th { 
            background: #17112e; padding: 10px 12px; color: #c4b5fd; font-weight: 700; text-transform: uppercase; font-size: 11px; border-bottom: 2px solid #3b2d6b; position: sticky; top: 0; z-index: 10; 
        }
        .tabla-items td { padding: 8px 12px; border-bottom: 1px solid #1f1838; vertical-align: middle; }
        .tabla-items tr:hover { background: rgba(139, 92, 246, 0.1); }
        .badge-pj { display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 10px; font-weight: 700; background: rgba(139, 92, 246, 0.2); border: 1px solid rgba(139, 92, 246, 0.4); color: #c4b5fd; }
        .badge-opt { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-right: 4px; margin-bottom: 3px; background: rgba(6, 182, 212, 0.15); border: 1px solid #06b6d4; color: #67e8f9; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-7xl mb-6 border-b border-purple-900/50 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-emerald-400">🛡️ MULTIVERSO - ARMADURAS & BAÚLES</h1>
            <p class="text-xs text-purple-300">Gestión de baúles y control exclusivo para administradores</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="session-user-badge" class="text-xs text-purple-300 font-bold bg-[#141126] px-3 py-1.5 rounded-lg border border-purple-900">Invitado</span>
            <a href="/" class="bg-purple-900 hover:bg-purple-800 text-purple-200 px-3 py-1.5 rounded-lg text-xs font-bold">← Volver al Monitor</a>
        </div>
    </header>

    <!-- FORMULARIO DE CARGA MANUAL (SOLO VISIBLE PARA ADMINS) -->
    <div id="panel-carga-manual" class="w-full max-w-7xl bg-[#141126] border border-emerald-600/50 p-6 rounded-xl mb-6 shadow-xl hidden">
        <h2 class="text-lg font-bold text-emerald-400 mb-4">➕ Cargar Ítem o Baúl Manualmente</h2>
        <form onsubmit="guardarItemManual(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- SCROLL 1: Sets oficiales por clase -->
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1">📜 Scroll 1: Seleccionar Set de Armadura</label>
                <select id="inputSetBase" required class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-xs outline-none">
                    <option value="">-- Seleccionar Set --</option>
                    <optgroup label="Dark Knight (BK / Guerrero)">
                        <option value="Leather">Leather</option><option value="Bronze">Bronze</option><option value="Scale">Scale</option><option value="Brass">Brass</option><option value="Plate">Plate</option><option value="Dragon">Dragon</option><option value="Phoenix">Phoenix</option><option value="Black Dragon">Black Dragon</option><option value="Brave">Brave</option>
                    </optgroup>
                    <optgroup label="Dark Wizard (SM / Mago)">
                        <option value="Pad">Pad</option><option value="Bone">Bone</option><option value="Sphinx">Sphinx</option><option value="Legendary">Legendary</option><option value="Grand Soul">Grand Soul</option><option value="Hades">Hades</option>
                    </optgroup>
                    <optgroup label="Fairy Elf (ELF / Arquera)">
                        <option value="Vine">Vine</option><option value="Silk">Silk</option><option value="Wind">Wind</option><option value="Spirit">Spirit</option><option value="Guardian">Guardian</option><option value="Seraphim">Seraphim</option>
                    </optgroup>
                    <optgroup label="Magic Gladiator (MG)">
                        <option value="Storm Crow">Storm Crow</option><option value="Thunder Hawk">Thunder Hawk</option><option value="Valiant">Valiant</option>
                    </optgroup>
                    <optgroup label="Dark Lord (DL)">
                        <option value="Adamantine">Adamantine</option><option value="Glorious">Glorious</option><option value="Sovereign">Sovereign</option>
                    </optgroup>
                    <optgroup label="Summoner (SU)">
                        <option value="Red Wing">Red Wing</option><option value="Demonic">Demonic</option>
                    </optgroup>
                    <optgroup label="Rage Fighter (RF)">
                        <option value="Sacred">Sacred</option><option value="Phoenix Soul">Phoenix Soul</option>
                    </optgroup>
                </select>
            </div>

            <!-- SCROLL 2: Tipo de Pieza -->
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1">📦 Scroll 2: Tipo de Pieza</label>
                <select id="inputTipoPieza" required class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-xs outline-none">
                    <option value="Armor">Armor (Pechera)</option>
                    <option value="Pants">Pants (Pantalón)</option>
                    <option value="Helm">Helm (Casco)</option>
                    <option value="Gloves">Gloves (Guantes)</option>
                    <option value="Boots">Boots (Botas)</option>
                    <option value="Shield">Shield (Escudo)</option>
                </select>
            </div>

            <!-- Textbox Baúl -->
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1">🏰 Nombre del Baúl</label>
                <input type="text" id="inputBaul" required placeholder="Ej. Baúl Principal / Warehouse 1" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-xs outline-none">
            </div>

            <!-- Textbox Asignado a -->
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1">👤 Asignado a (Miembro del Clan)</label>
                <input type="text" id="inputAsignado" placeholder="Ej. SirPinion" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-xs outline-none">
            </div>

            <!-- Checks de Opciones Excellent -->
            <div class="md:col-span-2">
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1">✨ Opciones Excellent</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 bg-[#0d0a1a] p-3 rounded-lg border border-purple-900 text-xs">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="chkOpciones" value="Aumento de HP máximo (3-5%)"> Aumento de HP máximo</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="chkOpciones" value="Aumento de SD máximo (3-5%)"> Aumento de SD máximo</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="chkOpciones" value="Reducción de daño (Damage Decrease: 4%)"> Reducción de daño (DD)</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="chkOpciones" value="Reflejo de daño (Reflect Damage: 4%)"> Reflejo de daño (Reflect)</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="chkOpciones" value="Resistencia a daño crítico"> Resistencia a crítico</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="chkOpciones" value="Tasa de drop de Zen"> Tasa de Zen</label>
                </div>
            </div>

            <!-- Botón Guardar -->
            <div class="md:col-span-2 flex justify-end">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition shadow">
                    💾 Guardar Ítem en la Web
                </button>
            </div>
        </form>
    </div>

    <!-- BUSCADOR -->
    <div class="w-full max-w-7xl bg-[#141126] border border-purple-900/60 p-4 rounded-xl mb-4 shadow flex gap-3">
        <input type="text" id="filtroTexto" oninput="aplicarFiltros()" placeholder="🔍 Buscar por nombre, baúl o asignado..." class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-xs outline-none">
    </div>

    <!-- TABLA -->
    <div class="w-full max-w-7xl tabla-scroll-box" id="scrollBox">
        <table class="tabla-items">
            <thead>
                <tr>
                    <th style="width: 130px;">ID / Archivo</th>
                    <th>Nombre del Ítem & Baúl</th>
                    <th style="width: 170px;">Clases</th>
                    <th>Opciones Principales</th>
                    <th style="width: 160px; text-align: center;">Asignado</th>
                </tr>
            </thead>
            <tbody id="tabla-items-body">
                <tr><td colspan="5" class="text-center py-8 text-gray-500">Cargando ítems...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let catalogo = [];
        let sesionAutorizada = false;

        async function chequearSesion() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (data.logged_in) {
                    sesionAutorizada = data.autorizado;
                    document.getElementById('session-user-badge').innerHTML = `👤 <strong>${data.user}</strong> (${data.rol})`;
                    if (sesionAutorizada) {
                        document.getElementById('panel-carga-manual').classList.remove('hidden');
                    }
                }
            } catch(e) {}
        }

        async function cargarItems() {
            try {
                const res = await fetch('/api/items?limit=100&offset=0');
                if (res.ok) {
                    const data = await res.json();
                    catalogo = data.items || [];
                    aplicarFiltros();
                }
            } catch(e) {}
        }

        function aplicarFiltros() {
            const busqueda = (document.getElementById('filtroTexto').value || '').toLowerCase();
            const filtrados = catalogo.filter(item => {
                const nombre = String(item.nombre || '').toLowerCase();
                const asignado = String(item.asignado_a || '').toLowerCase();
                return nombre.includes(busqueda) || asignado.includes(busqueda);
            });
            renderizarTabla(filtrados);
        }

        function renderizarTabla(items) {
            const tbody = document.getElementById('tabla-items-body');
            if (!items.length) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">Sin registros.</td></tr>';
                return;
            }
            tbody.innerHTML = items.map(item => {
                const opcionesLista = Array.isArray(item.opciones) ? item.opciones : [];
                const opcionesBadges = opcionesLista.map(opt => `<span class="badge-opt">${opt}</span>`).join('');
                return `
                    <tr>
                        <td class="font-mono text-amber-400 font-bold">${item.archivo_id}</td>
                        <td class="font-bold text-emerald-400">${item.nombre}</td>
                        <td><span class="badge-pj">${item.tipo}</span></td>
                        <td>${opcionesBadges || '-'}</td>
                        <td class="text-center font-semibold text-indigo-300">${item.asignado_a || 'Disponible'}</td>
                    </tr>
                `;
            }).join('');
        }

        async function guardarItemManual(e) {
            e.preventDefault();
            if (!sesionAutorizada) return alert("No autorizado.");

            const set_base = document.getElementById('inputSetBase').value;
            const tipo = document.getElementById('inputTipoPieza').value;
            const baul = document.getElementById('inputBaul').value.trim();
            const asignado = document.getElementById('inputAsignado').value.trim();

            const opciones = [];
            document.querySelectorAll('input[name="chkOpciones"]:checked').forEach(chk => opciones.push(chk.value));

            try {
                const res = await fetch('/api/items/agregar-manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ set_base, tipo, baul, asignado, opciones })
                });
                if (res.ok) {
                    alert("¡Ítem guardado con éxito!");
                    document.getElementById('inputBaul').value = '';
                    document.getElementById('inputAsignado').value = '';
                    document.querySelectorAll('input[name="chkOpciones"]').forEach(chk => chk.checked = false);
                    cargarItems();
                } else {
                    alert("Error al guardar ítem.");
                }
            } catch(e) {
                alert("Error de red.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            chequearSesion();
            cargarItems();
        });
    </script>
</body>
</html>
