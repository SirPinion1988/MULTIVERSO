<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ Catálogo de Ítems - MuDream Multiverso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0814; color: #e6e1ff; font-family: 'Segoe UI', system-ui, sans-serif; }
        .grid-items-mu { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.25rem; }
        .mu-item-card {
            background: #0f0c1b;
            border: 1px solid #2b214a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }
        .mu-item-card:hover {
            transform: translateY(-3px);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-6xl mb-6 border-b border-purple-900/50 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-emerald-400 drop-shadow">🛡️ CATÁLOGO DE ÍTEMS MU</h1>
            <p class="text-xs text-purple-300">Explorador de ítems y opciones de MuDream</p>
        </div>
        <a href="/" class="bg-purple-900 hover:bg-purple-800 text-purple-200 border border-purple-600 px-4 py-2 rounded-lg text-xs font-bold transition">
            ← Volver al Monitor
        </a>
    </header>

    <div class="w-full max-w-6xl space-y-6">
        <!-- Filtros -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-[#141126] border border-purple-900/60 p-4 rounded-xl">
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1.5">Filtrar por Raza / Clase:</label>
                <select id="filtroRaza" onchange="aplicarFiltros()" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-sm outline-none">
                    <option value="">Todas las Razas</option>
                    <option value="Dark Knight">Dark Knight</option>
                    <option value="Magic Gladiator">Magic Gladiator</option>
                    <option value="Dark Lord">Dark Lord</option>
                    <option value="Dark Wizard">Dark Wizard</option>
                    <option value="Fairy Elf">Fairy Elf</option>
                    <option value="Summoner">Summoner</option>
                    <option value="Rage Fighter">Rage Fighter</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1.5">Filtrar por Opción:</label>
                <select id="filtroOpcion" onchange="aplicarFiltros()" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-sm outline-none">
                    <option value="">Todas las Opciones</option>
                    <option value="SD">Maximum SD</option>
                    <option value="Damage decrease">Damage Decrease</option>
                    <option value="Critical damage">Critical Damage Resistance</option>
                    <option value="Strength">Increases Strength</option>
                    <option value="Agility">Increases Agility</option>
                    <option value="Energy">Increases Energy</option>
                    <option value="Vitality">Increases Vitality</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase text-purple-300 font-bold mb-1.5">Buscar por Nombre:</label>
                <input type="text" id="filtroTexto" oninput="aplicarFiltros()" placeholder="Ej. Bronze, Samut, Bow..." class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2.5 rounded-lg text-sm outline-none">
            </div>
        </div>

        <!-- Grilla de Ítems -->
        <div id="contenedor-items" class="grid-items-mu">
            <div class="text-gray-500 text-center col-span-full py-8">Cargando inventario...</div>
        </div>
    </div>

    <script>
        let catalogo = [];

        async function cargar() {
            try {
                const res = await fetch('/api/items');
                if (res.ok) {
                    catalogo = await res.json();
                    renderizar(catalogo);
                }
            } catch (e) {
                document.getElementById('contenedor-items').innerHTML = '<div class="text-red-400 text-center col-span-full">Error al cargar datos.</div>';
            }
        }

        function renderizar(items) {
            const c = document.getElementById('contenedor-items');
            if (!items || items.length === 0) {
                c.innerHTML = '<div class="text-gray-500 text-center col-span-full py-12">No hay ítems para mostrar.</div>';
                return;
            }
            c.innerHTML = items.map(item => {
                const img = `https://lh3.googleusercontent.com/d/${item.drive_id}`;
                return `
                    <div class="mu-item-card p-4 flex flex-col justify-between">
                        <div>
                            <div class="w-full h-52 bg-black rounded-lg flex items-center justify-center overflow-hidden mb-3 border border-purple-950">
                                <img src="${img}" alt="${item.nombre}" loading="lazy" class="max-h-full max-w-full object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200/0f0c1b/4ade80?text=Item+MU';">
                            </div>
                            <h3 class="text-center font-bold text-emerald-400 text-base mb-2">${item.nombre}</h3>
                            <div class="text-xs space-y-1 text-center mb-3">
                                ${item.base_score ? `<p class="text-amber-400 font-semibold">Base Score: ${item.base_score}</p>` : ''}
                                ${item.grade_score ? `<p class="text-purple-400 font-semibold">Grade Score: ${item.grade_score}</p>` : ''}
                                ${item.defense ? `<p class="text-blue-300 font-semibold">Defense: ${item.defense}</p>` : ''}
                                ${item.durability ? `<p class="text-gray-300">Durability: [${item.durability}]</p>` : ''}
                                ${item.requisitos?.strength ? `<p class="text-red-400">Strength available: ${item.requisitos.strength}</p>` : ''}
                                ${item.requisitos?.agility ? `<p class="text-gray-300">Agility available: ${item.requisitos.agility}</p>` : ''}
                                ${item.requisitos?.energy ? `<p class="text-cyan-300">Energy available: ${item.requisitos.energy}</p>` : ''}
                            </div>
                            <div class="text-center space-y-0.5 text-[11px] text-red-500 font-medium mb-3">
                                ${(item.clases || []).map(clase => `<div>Can be equipped by ${clase}</div>`).join('')}
                            </div>
                        </div>
                        <div class="border-t border-purple-900/50 pt-2 text-xs space-y-1">
                            ${(item.opciones || []).map(opt => {
                                const esLegendary = opt.includes('Legendary');
                                return `<p class="${esLegendary ? 'text-amber-400' : 'text-purple-400'} font-medium">${opt}</p>`;
                            }).join('')}
                            ${(item.bonus_excelente && item.bonus_excelente.length > 0) ? `
                                <div class="mt-2 pt-1 border-t border-purple-950">
                                    <span class="text-[11px] text-emerald-400 font-bold block mb-0.5">Exclusive Excellent Bonus:</span>
                                    ${item.bonus_excelente.map(b => `<p class="text-cyan-300 text-[11px]">${b}</p>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function aplicarFiltros() {
            const raza = document.getElementById('filtroRaza').value;
            const opcion = document.getElementById('filtroOpcion').value.toLowerCase();
            const busqueda = document.getElementById('filtroTexto').value.toLowerCase();

            const filtrados = catalogo.filter(item => {
                const matchRaza = !raza || (item.clases && item.clases.includes(raza));
                const textoOpciones = [...(item.opciones || []), ...(item.bonus_excelente || [])].join(' ').toLowerCase();
                const matchOpcion = !opcion || textoOpciones.includes(opcion);
                const matchTexto = !busqueda || (item.nombre && item.nombre.toLowerCase().includes(busqueda));
                return matchRaza && matchOpcion && matchTexto;
            });
            renderizar(filtrados);
        }

        document.addEventListener('DOMContentLoaded', cargar);
    </script>
</body>
</html>
