<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ MuDream Boss Timers - Multiverso ⚔️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0814; color: #e6e1ff; font-family: 'Segoe UI', system-ui, sans-serif; }
        .grid-bosses { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <!-- Encabezado -->
    <header class="w-full max-w-6xl mb-6 border-b border-purple-900/50 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-purple-400 drop-shadow">⚔️ MONITOR MUDREAM MULTIVERSO</h1>
            <p class="text-xs text-purple-300">Control de Bosses, Timers y Donaciones en Tiempo Real</p>
        </div>
        <div id="user-info-box" class="flex items-center gap-3 bg-[#141126] border border-purple-800/60 px-4 py-2 rounded-xl text-xs">
            <span id="user-display" class="text-purple-300 font-bold">Invitado</span>
            <span id="login-btn-container">
                <button type="button" onclick="toggleLoginModal()" id="btn-login-trigger" class="bg-purple-700 hover:bg-purple-600 text-white px-3 py-1 rounded font-bold transition">Ingresar</button>
            </span>
        </div>
    </header>

    <!-- TIMERS PRINCIPALES -->
    <div id="seccion-timers" class="w-full max-w-6xl">
        <div id="contenedor-bosses" class="grid-bosses">
            <div class="text-gray-500 text-center col-span-full py-8">Cargando timers de bosses...</div>
        </div>
    </div>

    <!-- MODAL LOGIN CORREGIDO -->
    <div id="modal-login" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="bg-[#141126] border border-purple-600 p-6 rounded-xl w-80 text-center shadow-2xl">
            <h3 class="text-lg font-bold text-purple-300 mb-4">🔐 Iniciar Sesión Encargado</h3>
            
            <form onsubmit="ejecutarLogin(event)">
                <input type="text" id="loginUser" placeholder="Usuario" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-3 text-sm outline-none" required>
                <input type="password" id="loginPass" placeholder="Contraseña" class="w-full bg-[#0d0a1a] border border-purple-900 text-white p-2 rounded mb-4 text-sm outline-none" required>
                
                <p id="loginErrorMsg" class="text-red-400 text-xs mb-3 hidden"></p>

                <div class="flex gap-2">
                    <button type="submit" class="w-full bg-purple-700 hover:bg-purple-600 text-white font-bold py-2 rounded text-sm">Entrar</button>
                    <button type="button" onclick="toggleLoginModal()" class="w-full bg-gray-800 text-gray-400 font-bold py-2 rounded text-sm">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let estadoWeb = { timers: {}, ocultos: [] };

        const BOSSES_FIJOS = {
            "Server 1": ["Muggron 1", "Muggron 2", "Dreadhorn 1", "Dreadhorn 2"],
            "Server 2": ["Muggron 1", "Muggron 2", "Dreadhorn 1", "Dreadhorn 2"],
            "Server 3": ["Muggron 1", "Muggron 2", "Dreadhorn 1", "Dreadhorn 2"],
            "Server 20": ["Muggron Barracks 1", "Muggron Barracks 2"]
        };

        const COOLDOWNS_LOCAL = { "Muggron 1": 180, "Muggron 2": 180, "Dreadhorn 1": 60, "Dreadhorn 2": 60 };

        async function verificarSesion() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (data.logged_in) {
                    document.getElementById('user-display').innerHTML = `👤 User: <strong class="text-white">${data.user}</strong> (${data.rol})`;
                    document.getElementById('login-btn-container').innerHTML = `<a href="/logout" class="bg-red-700 hover:bg-red-600 text-white px-3 py-1 rounded font-bold transition">Salir</a>`;
                }
            } catch (e) {}
        }

        function toggleLoginModal() {
            document.getElementById('modal-login').classList.toggle('hidden');
            document.getElementById('loginErrorMsg').classList.add('hidden');
        }

        async function ejecutarLogin(e) {
            if (e) e.preventDefault();
            
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;
            const errBox = document.getElementById('loginErrorMsg');

            errBox.classList.add('hidden');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.status === 'ok') {
                    location.reload();
                } else {
                    errBox.textContent = data.error || "Usuario o contraseña incorrectos";
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.textContent = "Error de conexión con el servidor";
                errBox.classList.remove('hidden');
            }
        }

        function formatearTiempo(segundosTotales) {
            if (segundosTotales <= 0) return "00:00:00";
            const h = Math.floor(segundosTotales / 3600);
            const m = Math.floor((segundosTotales % 3600) / 60);
            const s = segundosTotales % 60;
            return `${h > 0 ? String(h).padStart(2, '0') + ':' : ''}${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        async function cargarDatos() {
            try {
                const res = await fetch('/api/status_timers');
                if (res.ok) {
                    estadoWeb = await res.json();
                    renderizarUI();
                }
            } catch (e) {}
        }

        function renderizarUI() {
            const contenedor = document.getElementById('contenedor-bosses');
            contenedor.innerHTML = '';
            const ahoraUnix = Math.floor(Date.now() / 1000);

            ["Server 1", "Server 2", "Server 3", "Server 20"].forEach(svr => {
                const timersSvr = (estadoWeb.timers || {})[svr] || {};
                const listaFija = BOSSES_FIJOS[svr] || [];

                listaFija.forEach(bossName => {
                    const killUnix = timersSvr[bossName];
                    let cardHTML = '';

                    if (killUnix) {
                        const cdSeg = (COOLDOWNS_LOCAL[bossName] || 60) * 60;
                        const targetRespawn = killUnix + cdSeg;

                        if (ahoraUnix < targetRespawn) {
                            const restoSec = targetRespawn - ahoraUnix;
                            cardHTML = `
                                <div class="card p-4 rounded-xl bg-red-950/70 border border-red-500 text-center">
                                    <h3 class="font-bold text-red-100">${bossName} (${svr})</h3>
                                    <div class="my-2 py-1 bg-red-900/60 text-red-200 font-mono text-lg font-bold">
                                        🔴 ${formatearTiempo(restoSec)}
                                    </div>
                                </div>
                            `;
                        }
                    }

                    if (!cardHTML) {
                        cardHTML = `
                            <div class="card p-4 rounded-xl bg-purple-950/40 border border-purple-700 text-center">
                                <h3 class="font-bold text-purple-100">${bossName} (${svr})</h3>
                                <div class="my-2 py-1 bg-purple-900/40 text-purple-200 font-mono text-xs font-bold uppercase">
                                    ⚡ DISPONIBLE
                                </div>
                            </div>
                        `;
                    }
                    contenedor.innerHTML += cardHTML;
                });
            });
        }

        setInterval(cargarDatos, 3000);
        verificarSesion();
        cargarDatos();
    </script>
</body>
</html>
