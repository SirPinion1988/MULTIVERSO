<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ MuDream Boss Timers - Multiverso ⚔️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0814; color: #e6e1ff; font-family: 'Segoe UI', system-ui, sans-serif; }
        .grid-bosses { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }

        /* Estilos del Mapa Interactivo */
        .map-wrapper {
            position: relative;
            width: 720px;
            max-width: 95vw;
            aspect-ratio: 1 / 1;
            border: 2px solid #3b2d6b;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .map-bg { width: 100%; height: 100%; object-fit: contain; display: block; }

        .spot-btn {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            user-select: none;
        }
        .spot-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #747d8c;
            background: rgba(116, 125, 140, 0.2);
            transition: transform 0.15s, background 0.2s, border-color 0.2s;
        }
        .spot-btn:hover .spot-circle { transform: scale(1.2); }

        .spot-timer {
            margin-top: 4px;
            background: rgba(10, 8, 20, 0.92);
            border: 1px solid #3b2d6b;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            color: #ced6e0;
            white-space: nowrap;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.7);
        }

        /* Estados de los Spots */
        .state-idle .spot-circle { border-color: #eccc68; background: rgba(236, 204, 104, 0.25); box-shadow: 0 0 6px #eccc68; }
        .state-idle .spot-timer { color: #f1f2f6; border-color: #ffa502; background: rgba(255, 165, 2, 0.2); }

        .state-waiting .spot-circle { border-color: #ff4757; background: rgba(255, 71, 87, 0.25); box-shadow: 0 0 6px #ff4757; }
        .state-waiting .spot-timer { color: #ff6b81; border-color: #ff4757; }

        .state-window .spot-circle {
            border-color: #2ed573; background: rgba(46, 213, 115, 0.4);
            box-shadow: 0 0 14px #2ed573;
            animation: pulse 0.9s infinite alternate;
        }
        .state-window .spot-timer { color: #2ed573; border-color: #2ed573; background: rgba(46, 213, 115, 0.15); }

        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }

        /* Estilos de Catálogo de Ítems MU */
        .grid-items-mu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .mu-item-card {
            background: #0f0c1b;
            border: 1px solid #2b214a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.2s, border-color 0.2s;
        }
        .mu-item-card:hover {
            transform: translateY(-3px);
            border-color: #6366f1;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center relative">

    <!-- Notificación Toast Flotante -->
    <div id="toast-notificacion" class="fixed bottom-5 right-5 bg-purple-900 border border-purple-500 text-white px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center gap-2 text-sm font-semibold">
        <span id="toast-icono">⚠️</span>
        <span id="toast-mensaje">Notificación</span>
    </div>

    <!-- Encabezado -->
    <header class="w-full max-w-6xl mb-6 border-b border-purple-900/50 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-purple-400 drop-shadow">⚔️ MONITOR MUDREAM MULTIVERSO</h1>
            <p class="text-xs text-purple-300">Control de Bosses, Timers, Mapas, Donaciones y Catálogo de Ítems en Tiempo Real</p>
        </div>
        <div id="user-info-box" class="flex items-center gap-3 bg-[#141126] border border-purple-800/60 px-4 py-2 rounded-xl text-xs">
            <span id="user-display" class="text-purple-300 font-bold">Invitado</span>
            <span id="login-btn-container">
                <button onclick="toggleLoginModal()" id="btn-login-trigger" class="bg-purple-700 hover:bg-purple-600 text-white px-3 py-1 rounded font-bold transition">Ingresar</button>
            </span>
        </div>
    </header>

    <!-- Navegación de Vistas -->
    <div class="flex flex-wrap space-x-2 mb-6 overflow-x-auto w-full max-w-6xl justify-center gap-2">
        <button onclick="setVista('TODOS')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-purple-700 text-white" id="tab-TODOS">👁️ Vista General</button>
        <button onclick="setVista('Server 1')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-gray-400" id="tab-Server 1">Server 1</button>
        <button onclick="setVista('Server 2')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-gray-400" id="tab-Server 2">Server 2</button>
        <button onclick="setVista('Server 3')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-gray-400" id="tab-Server 3">Server 3</button>
        <button onclick="setVista('Server 20')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-gray-400" id="tab-Server 20">Server 20</button>
        
        <!-- Pestañas de Mapas -->
        <button onclick="setVista('MAPA_1')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-purple-300 border border-purple-900 hover:bg-purple-950" id="tab-MAPA_1">🗺️ Mapa S1</button>
        <button onclick="setVista('MAPA_2')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-purple-300 border border-purple-900 hover:bg-purple-950" id="tab-MAPA_2">🗺️ Mapa S2</button>
        <button onclick="setVista('MAPA_3')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-purple-300 border border-purple-900 hover:bg-purple-950" id="tab-MAPA_3">🗺️ Mapa S3</button>

        <!-- Pestaña de Ítems MU -->
        <button onclick="setVista('ITEMS')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-emerald-950/80 border border-emerald-600 text-emerald-300 hover:bg-emerald-900" id="tab-ITEMS">🛡️ Ítems MU</button>

        <button onclick="setVista('BOTS')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-gray-800 text-gray-400" id="tab-BOTS">🤖 Bots Activos</button>
        <button onclick="setVista('DONACIONES')" class="btn-tab px-4 py-2 rounded-lg font-bold bg-yellow-900/80 border border-yellow-600 text-yellow-300 hover:bg-yellow-800" id="tab-DONACIONES">💎 Donaciones</button>
        <button onclick="setVista('USUARIOS')" id="tab-USUARIOS" class="btn-tab px-4 py-2 rounded-lg font-bold bg-indigo-900 border border-indigo-500 text-indigo-200 hidden">👥 Crear Encargados</button>
        
        <a id="btn-descarga-bot" href="{{ link_descarga }}" target="_blank" class="px-4 py-2 rounded-lg font-bold bg-purple-900 border border-purple-500 text-purple-200 hover:bg-purple-800 transition flex items-center gap-1 hidden">
            ⬇️ Descargar Bot (.exe)
        </a>
    </div>

    <!-- Panel Manual -->
    <div id="panel-kill-manual" class="w-full max-w-6xl bg-[#141126] border border-purple-800 rounded-xl p-4 mb-6 shadow-lg">
        <h3 class="text-center font-bold text-purple-300 mb-3 text-sm uppercase tracking-wider">⚡ Cargar Kill Manual / Iniciar Boss</h3>
        <div class="flex flex-wrap gap-3 justify-center items-center">
            <select id="manualServer" class="bg-[#0d0a1a] border border-purple-900 text-white text-sm rounded-lg p-2.5 outline-none">
                <option value="Server 1">Server 1</option>
                <option value="Server 2">Server 2</option>
                <option value="Server 3">Server 3</option>
                <option value="Server 20">Server 20</option>
